[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "pyproject.toml"]
extend-exclude = [".kaggle_runtime", "artifacts", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ui", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
